{%- comment -%}
  Link social com ícone. Parâmetros:
    icon  — caminho do SVG em _includes (ex.: svg/github.svg)
    url   — URL completa (definida no _config.yml)
    label — texto do link
{%- endcomment -%}
<a class="social-link" href="{{ include.url }}" target="_blank" rel="noopener"><span class="icon">{% include {{ include.icon }} %}</span> <span class="label-text">{{ include.label }}</span></a>
