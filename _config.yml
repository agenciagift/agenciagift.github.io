title: Agência Gift
description: 'Comunidade de desenvolvedores: estudo, carreira e um lugar seguro para perguntar o básico.'
timezone: America/Sao_Paulo
lang: pt-BR
baseurl: ''
url: https://agenciagift.github.io
markdown: kramdown
youtube_url: https://www.youtube.com/@agenciagift
whatsapp_url: https://chat.whatsapp.com/CSnCKKPRST3JfY695TsSGL
caixa_perguntas_url: https://forms.gle/292cThFr1XPFQoVM7
github_url: https://github.com/agenciagift
collections:
  posts:
    title: Posts
    output: true
  uploads:
    title: Uploads
    output: true
defaults:
- scope:
    path: ''
  values:
    image: /media/fundo-padrao.jpg
- scope:
    path: ''
    type: posts
  values:
    layout: post
    permalink: post/:title/
    audio:
- scope:
    path: ''
    type: pages
  values:
    layout: page
permalink: ":pretty/"
fonts:
- Quicksand
- Righteous
- Saira
sass:
  style: compressed
plugins:
- jekyll-coffeescript
- jekyll-paginate
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-feed
feed:
  posts_limit: 20
paginate: 10
paginate_path: timeline/:num/
exclude:
- CLAUDE.md
- Gemfile
- Gemfile.lock
- node_modules
- vendor
- docs
- gulpfile.js
- README.md
- desktop.ini
